<!doctype html><html><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"></head><body><script>
'use strict';
const channel = <?!= channelJson ?>;
const parentOrigin = <?!= originJson ?>;
const protocol = 'trip-poll-v2';
const actions = ['bootstrap','loginBegin','login','logout','load','addPlace','deletePlace','saveUnavailable','deleteUnavailable','vote','saveSettings','editPlace','saveUser','addAttraction','deleteAttraction'];
function send(message) { window.top.postMessage({protocol,channel,...message},parentOrigin); }
window.addEventListener('message',event => {
  const m = event.data;
  if (event.source !== window.top || event.origin !== parentOrigin || !m || m.protocol !== protocol || m.channel !== channel) return;
  if (m.type === 'hello') { send({type:'ready'}); return; }
  if (m.type !== 'request' || typeof m.id !== 'string' || !m.request || !actions.includes(m.request.action)) return;
  google.script.run.withSuccessHandler(result => send({type:'response',id:m.id,result}))
    .withFailureHandler(error => send({type:'response',id:m.id,error:error.message||'連線失敗，請稍後重試。'})).api(m.request);
});
send({type:'ready'});
</script></body></html>
